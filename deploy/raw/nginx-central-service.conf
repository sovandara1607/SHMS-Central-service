# Copy to /etc/nginx/sites-available/central-service on
# centralservice-api-server, then:
#   ln -s /etc/nginx/sites-available/central-service /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Internal-only API (firewalled to app1's IP — see DEPLOYMENT-RAW.md step 3),
# so plain HTTP on 8100 is fine here, matching the current Docker setup
# where central-service was never TLS-terminated itself either.

server {
    listen 8100;
    listen [::]:8100;
    server_name _;

    root /var/www/central-service/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-central-service.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/central-service-access.log;
    error_log /var/log/nginx/central-service-error.log;
}
